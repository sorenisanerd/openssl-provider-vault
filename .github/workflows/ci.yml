name: CI

on:
  push:
  pull_request:

jobs:
  test-install-and-openssl-config:
    name: Tests, install, and OpenSSL config
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libcmocka-dev \
            libcurl4-openssl-dev \
            libjson-c-dev \
            libssl-dev \
            libtool \
            pkg-config \
            unzip

      - name: Install Vault CLI/server
        env:
          VAULT_VERSION: 1.20.0
        run: |
          curl -fsSLo "$RUNNER_TEMP/vault.zip" "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          unzip -q "$RUNNER_TEMP/vault.zip" -d "$RUNNER_TEMP/vault"
          sudo install -m 0755 "$RUNNER_TEMP/vault/vault" /usr/local/bin/vault
          vault version

      - name: Start Vault dev server for integration tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: |
          vault server \
            -dev \
            -dev-root-token-id="$VAULT_TOKEN" \
            -dev-listen-address=127.0.0.1:8200 \
            >"$RUNNER_TEMP/vault.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/vault.pid"
          for _ in {1..30}; do
            if vault status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          vault status
          vault secrets enable transit

      - name: Generate build system
        run: autoreconf -fi

      - name: Configure with tests enabled
        run: |
          OPENSSL_MODULESDIR="$(openssl version -m | cut -d '"' -f 2)"
          ./configure --enable-tests --libdir="$(dirname "$OPENSSL_MODULESDIR")"

      - name: Build
        run: make V=1

      - name: Run test suite
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
        run: make check V=1

      - name: Install provider with privileged install target
        run: sudo make install V=1

      - name: Configure OpenSSL from /etc and verify installed provider loads
        run: |
          sudo mkdir -p /etc/ssl/openssl.conf.d
          echo .include /etc/ssl/openssl.conf.d | sudo tee -a /etc/ssl/openssl.cnf
          sudo tee /etc/ssl/openssl.conf.d/vault.cnf >/dev/null <<'EOF'
          [provider_sect]
          vault = vault_sect

          [vault_sect]
          activate = 1
          EOF
          openssl list -providers -verbose
          openssl list -providers | grep -q '^  vault$'
